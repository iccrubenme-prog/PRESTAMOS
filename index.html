<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1a2233; --text-soft:#5b6577;
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#e8efff;
  --green:#16a34a; --green-soft:#e8f9ee; --orange:#d97706; --orange-soft:#fff4e5;
  --red:#dc2626; --red-soft:#fdeaea; --gray:#6b7280; --gray-soft:#eef0f3;
  --border:#e2e6ed; --shadow:0 2px 10px rgba(20,30,60,.06); --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#12161f; --card:#1a2030; --text:#eef1f6; --text-soft:#a7b0c2;
    --primary:#5b8cff; --primary-dark:#4a76e0; --primary-soft:#20304f;
    --green:#3ddc7f; --green-soft:#173323; --orange:#f2a83c; --orange-soft:#3a2c12;
    --red:#ff6b6b; --red-soft:#3a1c1c; --gray:#9aa4b5; --gray-soft:#242b3a;
    --border:#2b3348; --shadow:0 2px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12161f; --card:#1a2030; --text:#eef1f6; --text-soft:#a7b0c2;
  --primary:#5b8cff; --primary-dark:#4a76e0; --primary-soft:#20304f;
  --green:#3ddc7f; --green-soft:#173323; --orange:#f2a83c; --orange-soft:#3a2c12;
  --red:#ff6b6b; --red-soft:#3a1c1c; --gray:#9aa4b5; --gray-soft:#242b3a;
  --border:#2b3348; --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:1.45;}
img,svg{max-width:100%;}
button{font-family:inherit;}

.brand-bar{background:#fff;display:flex;align-items:center;justify-content:center;
  padding:16px 20px;border-bottom:1px solid var(--border);}
.brand-logo{height:38px;width:auto;display:block;}
@media (min-width:480px){.brand-logo{height:46px;}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);
  color:#fff;padding:18px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;}
.topbar .sub{font-size:12.5px;opacity:.85;margin-top:2px;}
.topbar-icon{font-size:26px;width:40px;height:40px;background:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:5px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);flex:none;}
.topbar-icon img{width:100%;height:100%;object-fit:contain;display:block;}
.topbar-actions{margin-left:auto;display:flex;gap:8px;}
.icon-btn{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:12px;
  padding:10px 12px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;
  align-items:center;gap:6px;min-height:44px;}
.icon-btn:active{background:rgba(255,255,255,.3);}
.role-badge{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:700;letter-spacing:.3px;}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 100px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);}

/* ---- login / conexión ---- */
.login-wrap{max-width:460px;margin:40px auto;padding:0 16px;}
.login-card{padding:26px 22px;}
.login-card h2{margin:0 0 6px;font-size:21px;}
.login-card p.desc{color:var(--text-soft);font-size:14.5px;margin:0 0 20px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px;}
.login-field input{width:100%;border:2px solid var(--border);background:var(--bg);color:var(--text);
  border-radius:12px;padding:13px 14px;font-size:16px;outline:none;}
.login-field input:focus{border-color:var(--primary);background:var(--card);}
.login-btn{width:100%;border:none;background:var(--primary);color:#fff;border-radius:12px;
  padding:15px;font-size:16.5px;font-weight:800;cursor:pointer;min-height:52px;}
.login-btn:active{background:var(--primary-dark);}
.login-btn:disabled{opacity:.6;}
.login-error{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;
  font-size:14px;font-weight:600;margin-top:14px;}
.login-help{margin-top:18px;font-size:12.5px;color:var(--text-soft);line-height:1.5;}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
.spinner.spinner-dark{border-color:rgba(37,99,235,.25);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}
.role-btn{margin-bottom:12px;}
.role-btn-alt{background:var(--card);color:var(--primary);border:2px solid var(--primary);}
.role-btn-alt:active{background:var(--primary-soft);}

/* ---- search screen ---- */
.search-box{padding:16px;margin-bottom:16px;}
.search-input-row{display:flex;align-items:center;gap:10px;background:var(--gray-soft);
  border-radius:14px;padding:6px 14px;border:2px solid transparent;}
.search-input-row:focus-within{border-color:var(--primary);}
.search-input-row .ico{font-size:22px;flex:none;}
#searchInput{flex:1;border:none;background:transparent;outline:none;font-size:19px;padding:12px 0;
  color:var(--text);min-width:0;}
#searchInput::placeholder{color:var(--text-soft);}
.clear-btn{border:none;background:none;color:var(--text-soft);font-size:20px;cursor:pointer;
  padding:6px;flex:none;display:none;}
.filter-group-label{font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;
  letter-spacing:.4px;margin:14px 2px 8px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:2px solid var(--border);background:var(--card);color:var(--text-soft);border-radius:999px;
  padding:8px 14px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:40px;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip-green.active{background:var(--green);border-color:var(--green);}
.chip-red.active{background:var(--red);border-color:var(--red);}
.chip-orange.active{background:var(--orange);border-color:var(--orange);}
.chip-gray.active{background:var(--gray);border-color:var(--gray);}
.chip.warn-active{background:var(--red-soft);border-color:var(--red);color:var(--red);}
.chip.sort-active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);}
.stats-line{color:var(--text-soft);font-size:13.5px;margin:2px 4px 14px;text-align:center;}
.hint-box{text-align:center;padding:50px 20px;color:var(--text-soft);}
.hint-box .big-emoji{font-size:52px;display:block;margin-bottom:14px;}
.hint-box p{font-size:16px;margin:6px 0;}
.result-list{display:flex;flex-direction:column;gap:10px;}
.result-card{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.result-card:active{transform:scale(.985);background:var(--primary-soft);}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none;}
.result-main{flex:1;min-width:0;}
.result-name{font-weight:700;font-size:16.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-meta{font-size:13.5px;color:var(--text-soft);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;}
.tag.blue{background:var(--primary-soft);color:var(--primary-dark);}
.tag.green{background:var(--green-soft);color:var(--green);}
.tag.orange{background:var(--orange-soft);color:var(--orange);}
.tag.red{background:var(--red-soft);color:var(--red);}
.tag.gray{background:var(--gray-soft);color:var(--gray);}
.chev{color:var(--text-soft);font-size:20px;flex:none;}
.load-more{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;
  border:2px dashed var(--border);background:transparent;color:var(--primary);font-weight:700;
  font-size:15px;cursor:pointer;min-height:48px;}

/* ---- detail screen ---- */
.detail-header{display:flex;align-items:center;gap:10px;padding:14px 16px;}
.back-btn{border:none;background:var(--gray-soft);color:var(--text);border-radius:12px;
  padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  gap:6px;min-height:44px;}
.back-btn:active{background:var(--border);}
.name-block{flex:1;min-width:0;}
.name-block .nm{font-size:19px;font-weight:800;line-height:1.25;}
.name-block .idl{font-size:12.5px;color:var(--text-soft);}

.save-banner{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));
  transform:translateX(-50%) translateY(-8px);opacity:0;visibility:hidden;pointer-events:none;
  background:var(--green);color:#fff;padding:14px 26px;border-radius:999px;font-weight:800;
  font-size:16px;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:60;
  transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s;white-space:nowrap;
  display:flex;align-items:center;gap:8px;}
.save-banner .check{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
.save-banner.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);
  transition:opacity .22s ease,transform .22s ease,visibility 0s linear 0s;}
.save-banner.error{background:var(--red);}

.section{margin-bottom:16px;padding:16px;}
.section-title{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;
  color:var(--primary);margin-bottom:14px;text-transform:uppercase;letter-spacing:.3px;}
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:2px;}
.field .help{font-size:12.5px;color:var(--text-soft);margin-bottom:7px;}
.field input[type=text],.field input[type=tel],.field input[type=number],.field select,.field textarea{
  width:100%;border:2px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;
  padding:13px 14px;font-size:16.5px;font-family:inherit;outline:none;}
.field textarea{resize:vertical;min-height:70px;line-height:1.4;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--card);}
.field.readonly input,.field.readonly textarea{background:var(--gray-soft);color:var(--text-soft);border-color:var(--gray-soft);}
.lock-tag{font-size:11.5px;font-weight:700;color:var(--text-soft);background:var(--gray-soft);
  border-radius:6px;padding:2px 7px;margin-left:6px;display:inline-block;vertical-align:middle;}

/* ---- pantalla de configuración de campos ---- */
.cfg-intro{padding:14px 16px;color:var(--text-soft);font-size:13.5px;line-height:1.5;}
.cfg-card{padding:16px;margin-bottom:12px;}
.cfg-card .cfg-nombre{font-weight:800;font-size:15.5px;margin-bottom:2px;}
.cfg-card .cfg-ayuda{font-size:12.5px;color:var(--text-soft);margin-bottom:12px;}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.cfg-group-label{font-size:11px;font-weight:800;color:var(--text-soft);text-transform:uppercase;
  letter-spacing:.3px;margin:4px 0 2px;grid-column:1 / -1;}
.cfg-switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg);border-radius:10px;padding:9px 12px;}
.cfg-switch-row span{font-size:13.5px;font-weight:600;}
.cfg-switch{position:relative;width:42px;height:24px;flex:none;}
.cfg-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;}
.cfg-switch .track{position:absolute;inset:0;background:var(--gray-soft);border-radius:999px;
  transition:background .15s ease;border:2px solid var(--border);}
.cfg-switch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease;}
.cfg-switch input:checked + .track{background:var(--green);border-color:var(--green);}
.cfg-switch input:checked + .track + .thumb{transform:translateX(18px);}
.cfg-switch input:disabled + .track{opacity:.5;cursor:not-allowed;}
.pass-row{position:relative;}
.pass-row input{padding-right:76px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;}
.pass-toggle{position:absolute;right:6px;top:6px;bottom:6px;border:none;background:var(--primary-soft);
  color:var(--primary-dark);border-radius:9px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;}
.auto-date{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);
  background:var(--gray-soft);border-radius:10px;padding:8px 12px;}
.auto-date .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
.quick-picks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.quick-pick{border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.quick-pick:active{background:var(--primary-soft);border-color:var(--primary);}
.saving-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);
  margin-left:6px;vertical-align:middle;}

.screen{display:none;}
.screen.active{display:block;}
.sync-banner{font-size:13px;font-weight:600;text-align:center;padding:9px 14px;}
.sync-banner.info{background:var(--primary-soft);color:var(--primary-dark);}
.sync-banner.warn{background:var(--orange-soft);color:var(--orange);}
.sync-banner.err{background:var(--red-soft);color:var(--red);}
footer.note{text-align:center;color:var(--text-soft);font-size:12px;margin-top:22px;padding:0 10px;}
.footer-brand{display:inline-block;margin-top:8px;font-weight:700;letter-spacing:.3px;color:var(--text-soft);}
.center-loading{text-align:center;padding:60px 20px;color:var(--text-soft);}
.center-loading .big-emoji{font-size:48px;display:block;margin-bottom:12px;}
</style>
</head>

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function fmtDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}
function hasField(key){ return !!CAMPOS_BY_KEY[key]; }
function isEditable(key){ return CAMPOS_BY_KEY[key] && CAMPOS_BY_KEY[key].editable; }

/* ============================================================
   CONEXIÓN / LOGIN (usuario + contraseña contra la hoja Roles)
   ============================================================ */
function loadSavedCreds(){
  try{
    const raw = localStorage.getItem('prismavia_cred_v1');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveCreds(usuario, contrasena){
  try{ localStorage.setItem('prismavia_cred_v1', JSON.stringify({usuario, contrasena})); }catch(e){}
}
function clearCreds(){
  try{ localStorage.removeItem('prismavia_cred_v1'); }catch(e){}
}

async function apiGet(action){
  const url = API_URL + (API_URL.indexOf('?')>-1?'&':'?') + 'action=' + encodeURIComponent(action)
    + '&usuario=' + encodeURIComponent(ACCESS_USER) + '&contrasena=' + encodeURIComponent(ACCESS_PASS);
  const res = await fetch(url, {method:'GET'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS en Apps Script
    body: JSON.stringify(Object.assign({usuario: ACCESS_USER, contrasena: ACCESS_PASS}, payload))
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideLoginError(){
  document.getElementById('loginError').style.display = 'none';
}

function setLoginBusy(busy){
  document.getElementById('btnEntrar').disabled = busy;
  document.getElementById('inputUsuario').disabled = busy;
  document.getElementById('inputContrasena').disabled = busy;
  document.getElementById('loginSpinnerWrap').style.display = busy ? 'block' : 'none';
}

async function attemptLogin(usuario, contrasena, silent){
  ACCESS_USER = usuario;
  ACCESS_PASS = contrasena;
  if(!silent) setLoginBusy(true);
  hideLoginError();
  try{
    const boot = await apiGet('bootstrap');
    if(!boot.ok){
      if(boot.error === 'credenciales_invalidas'){
        showLoginError('Usuario o contraseña incorrectos.');
      }else{
        showLoginError('No se pudo conectar: ' + (boot.error||'error desconocido'));
      }
      if(!silent) setLoginBusy(false);
      return false;
    }
    ROL = boot.rol;
    CAMPOS = boot.campos;
    CAMPOS_BY_KEY = {};
    CAMPOS.forEach(c => CAMPOS_BY_KEY[c.clave] = c);
    CATALOGOS = boot.catalogos || {};

    const listRes = await apiGet('list');
    if(!listRes.ok){
      showLoginError('Se conectó, pero no se pudieron leer los clientes: ' + (listRes.error||''));
      if(!silent) setLoginBusy(false);
      return false;
    }
    workingData = listRes.clientes.map(r => Object.assign({}, r));
    byUid = {};
    workingData.forEach(r => byUid[r.uid] = r);

    saveCreds(usuario, contrasena);
    enterApp(boot.nombre || ROL);
    return true;
  }catch(err){
    showLoginError('No se pudo conectar. Revisa tu conexión a internet. (' + err.message + ')');
    if(!silent) setLoginBusy(false);
    return false;
  }
}

function enterApp(nombreRol){

  document.getElementById('exportBtn').style.display = ROL==='admin' ? '' : 'none';
  document.getElementById('configBtn').style.display = ROL==='admin' ? '' : 'none';
  buildDynamicFilters();
  renderResults();
}

/* ============================================================
   FILTROS DINÁMICOS (según qué campos existan para este rol)
   ============================================================ */
function statusTag(r){
  const s = (r.estatus_pass||'').toUpperCase();
  if(s.includes('VIGENTE')) return {c:'green', t:'Vigente', key:'vigente'};
  if(s.includes('NO LOCALIZADO') || s.includes('CURP') || s.includes('NSS')) return {c:'red', t:'Revisar', key:'revisar'};
  if(s.includes('CLIENTE EXTRA') || s.includes('NO APLICA')) return {c:'gray', t:'No aplica', key:'sin_dato'};
  if(!s) return {c:'gray', t:'Sin dato', key:'sin_dato'};
  return {c:'orange', t:'Pendiente', key:'pendiente'};
}
const PRIORITY_ORDER = {revisar:0, pendiente:1, sin_dato:2, vigente:3};

function buildDynamicFilters(){
  const host = document.getElementById('filtersDynamic');
  let html = '';
  if(hasField('tipo')){
    html += '<div class="filter-group-label">Tipo de registro</div><div class="filters" id="filtersTipo">'
      + '<button class="chip active" data-group="tipo" data-filter="TODOS">Todos</button>'
      + '<button class="chip" data-group="tipo" data-filter="CLIENTE">Clientes</button>'
      + '<button class="chip" data-group="tipo" data-filter="PROSPECTO">Prospectos</button></div>';
  }
  if(hasField('estatus_pass')){
    html += '<div class="filter-group-label">Estado de la contraseña</div><div class="filters" id="filtersEstado">'
      + '<button class="chip active" data-group="estado" data-filter="TODOS">Todos</button>'
      + '<button class="chip chip-green" data-group="estado" data-filter="vigente">🟢 Vigente</button>'
      + '<button class="chip chip-red" data-group="estado" data-filter="revisar">🔴 Revisar</button>'
      + '<button class="chip chip-orange" data-group="estado" data-filter="pendiente">🟠 Pendiente</button>'
      + '<button class="chip chip-gray" data-group="estado" data-filter="sin_dato">⚪ Sin dato</button></div>';
  }
  html += '<div class="filter-group-label">Otros filtros</div><div class="filters" id="filtersExtra">'
    + '<button class="chip" id="chipIncompletos">⚠️ Datos incompletos</button>'
    + '<button class="chip sort-active" id="chipSortToggle">↕️ Ordenar: Pendientes primero</button></div>';
  host.innerHTML = html;

  document.querySelectorAll('#filtersTipo .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#filtersTipo .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilterTipo = chip.dataset.filter; resultLimit=60; renderResults();
    });
  });
  document.querySelectorAll('#filtersEstado .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#filtersEstado .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilterEstado = chip.dataset.filter; resultLimit=60; renderResults();
    });
  });
  const chipInc = document.getElementById('chipIncompletos');
  if(chipInc) chipInc.addEventListener('click', function(){
    onlyIncomplete = !onlyIncomplete;
    this.classList.toggle('warn-active', onlyIncomplete);
    resultLimit=60; renderResults();
  });
  const chipSort = document.getElementById('chipSortToggle');
  if(chipSort) chipSort.addEventListener('click', function(){
    sortPendingFirst = !sortPendingFirst;
    this.textContent = sortPendingFirst ? '↕️ Ordenar: Pendientes primero' : '↕️ Ordenar: Nombre (A-Z)';
    this.classList.toggle('sort-active', sortPendingFirst);
    resultLimit=60; renderResults();
  });
}

function isIncomplete(r){
  const checks = ['celular','correo','capacidad','estatus_pass'].filter(k => hasField(k));
  if(checks.length===0) return false;
  return checks.some(k => !r[k]);
}
function matchesFilters(r){
  if(hasField('tipo') && currentFilterTipo!=='TODOS' && (r.tipo||'').toUpperCase()!==currentFilterTipo) return false;
  if(hasField('estatus_pass') && currentFilterEstado!=='TODOS' && statusTag(r).key!==currentFilterEstado) return false;
  if(onlyIncomplete && !isIncomplete(r)) return false;
  return true;
}
function searchRecords(q){
  q = q.trim().toLowerCase();
  let list = workingData.filter(r=>{
    if(!matchesFilters(r)) return false;
    if(q.length===0) return true;
    return (r.nombre||'').toLowerCase().includes(q)
        || (r.celular||'').toLowerCase().includes(q)
        || (r.correo||'').toLowerCase().includes(q);
  });
  if(sortPendingFirst && hasField('estatus_pass')){
    list.sort((a,b)=>{
      const pa = PRIORITY_ORDER[statusTag(a).key], pb = PRIORITY_ORDER[statusTag(b).key];
      if(pa!==pb) return pa-pb;
      return (a.nombre||'').localeCompare(b.nombre||'', 'es');
    });
  }else{
    list.sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||'', 'es'));
  }
  return list;
}

/* ============================================================
   LISTA DE RESULTADOS
   ============================================================ */
function renderResults(){
  const area = document.getElementById('resultArea');
  const stats = document.getElementById('statsLine');
  const q = document.getElementById('searchInput').value;
  const matches = searchRecords(q);

  if(matches.length===0){
    stats.textContent = 'Sin resultados';
    area.innerHTML = '<div class="card hint-box"><span class="big-emoji">🙁</span><p>Ningún cliente coincide con estos filtros</p><p>Prueba quitando algún filtro</p></div>';
    return;
  }
  stats.textContent = matches.length + ' de ' + workingData.length + (matches.length===1 ? ' cliente' : ' clientes');
  const shown = matches.slice(0, resultLimit);
  let html = '<div class="result-list">';
  shown.forEach(r=>{
    const tag = hasField('estatus_pass') ? statusTag(r) : null;
    html += '<div class="card result-card" data-uid="'+r.uid+'">'
      + '<div class="avatar">'+escapeHtml(initials(r.nombre))+'</div>'
      + '<div class="result-main">'
        + '<div class="result-name">'+escapeHtml(r.nombre||'(Sin nombre)')+'</div>'
        + '<div class="result-meta">'
          + (hasField('tipo') && r.tipo ? '<span class="tag blue">'+escapeHtml(r.tipo)+'</span>' : '')
          + (tag ? '<span class="tag '+tag.c+'">'+tag.t+'</span>' : '')
          + (hasField('celular') && r.celular ? '<span>📱 '+escapeHtml(r.celular)+'</span>' : '')
        + '</div></div>'
      + '<div class="chev">›</div></div>';
  });
  html += '</div>';
  if(matches.length > shown.length){
    html += '<button class="load-more" id="loadMoreBtn">Ver más resultados (' + (matches.length - shown.length) + ' restantes)</button>';
  }
  area.innerHTML = html;
  area.querySelectorAll('.result-card').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.dataset.uid));
  });
  const lm = document.getElementById('loadMoreBtn');
  if(lm) lm.addEventListener('click', ()=>{ resultLimit += 60; renderResults(); });
}

function buildSelectHtml(catalogo, currentValue){
  const canon = CATALOGOS[catalogo] || [];
  let html = '<select data-field-select="1">';
  html += '<option value="">— Sin definir —</option>';
  let found = canon.some(o => o === currentValue);
  canon.forEach(o=>{
    html += '<option value="'+escapeHtml(o)+'" '+(o===currentValue?'selected':'')+'>'+escapeHtml(o)+'</option>';
  });
  if(currentValue && !found){
    html += '<option value="'+escapeHtml(currentValue)+'" selected>'+escapeHtml(currentValue)+' (valor registrado)</option>';
  }
  html += '</select>';
  return html;
}

function renderFieldHtml(campo, value){
  value = value || '';
  const readonly = !campo.editable;
  let inner = '';
  if(readonly){
    inner = '<input type="text" value="'+escapeHtml(value)+'" disabled>';
  } else if(campo.tipo==='lista'){
    inner = buildSelectHtml(campo.catalogo, value).replace('data-field-select="1"', 'data-field="'+campo.clave+'"');
  } else if(campo.tipo==='texto_largo'){
    inner = '<textarea data-field="'+campo.clave+'" rows="2">'+escapeHtml(value)+'</textarea>';
  } else if(campo.tipo==='numero'){
    inner = '<input type="number" step="0.01" inputmode="decimal" data-field="'+campo.clave+'" value="'+escapeHtml(value)+'" placeholder="0.00">';
  } else if(campo.tipo==='telefono'){
    inner = '<input type="tel" inputmode="tel" data-field="'+campo.clave+'" value="'+escapeHtml(value)+'" placeholder="10 dígitos">';
  } else if(campo.tipo==='contrasena'){
    inner = '<div class="pass-row"><input type="password" data-field="'+campo.clave+'" value="'+escapeHtml(value)+'" autocomplete="off" placeholder="Contraseña">'
          + '<button type="button" class="pass-toggle">Mostrar</button></div>';
  } else if(campo.tipo==='texto_rapido'){
    inner = '<div class="quick-picks">'
      + '<button type="button" class="quick-pick" data-target="'+campo.clave+'" data-value="A. ALTA +100">A. Alta</button>'
      + '<button type="button" class="quick-pick" data-target="'+campo.clave+'" data-value="* +50 -100">*</button>'
      + '<button type="button" class="quick-pick" data-target="'+campo.clave+'" data-value="B. MEDIA +20 -100">B. Media</button>'
      + '<button type="button" class="quick-pick" data-target="'+campo.clave+'" data-value="C. BAJA -20">C. Baja</button></div>'
      + '<input type="text" data-field="'+campo.clave+'" value="'+escapeHtml(value)+'" placeholder="Escribe una clasificación o comentario">';
  } else if(campo.tipo==='fecha_auto'){
    inner = '<input type="text" value="'+(fmtDate(value)||'sin registrar')+'" disabled>';
  } else {
    inner = '<input type="text" data-field="'+campo.clave+'" value="'+escapeHtml(value)+'">';
  }
  let lock = readonly ? '<span class="lock-tag">Solo lectura</span>' : '';
  let cls = readonly ? 'field readonly' : 'field';
  return '<div class="'+cls+'" data-field-wrap="'+campo.clave+'"><label>'+escapeHtml(campo.etiqueta)+lock+'</label>'
    + (campo.ayuda ? '<div class="help">'+escapeHtml(campo.ayuda)+'</div>' : '')
    + inner + '</div>';
}

      handleFieldChange(uid, btn.dataset.target, input);

/* ============================================================
   GUARDAR CAMBIOS (POST al Apps Script)
   ============================================================ */
async function handleFieldChange(uid, key, input){
  const rec = byUid[uid];
  const newVal = input.value;
  const oldVal = rec[key] || '';
  if(newVal === oldVal) return;
  if(!isEditable(key)) return;

  input.disabled = true;
  try{
    const resp = await apiPost({action:'update', uid: rec.id || rec.uid, clave:key, valor:newVal});
    if(!resp.ok){
      showSaveBanner('No se pudo guardar: ' + (resp.error||'error'), true);
      input.value = oldVal;
      input.disabled = false;
      return;
    }
    rec[key] = newVal;
    if(resp.resultado && resp.resultado.fechas){
      Object.keys(resp.resultado.fechas).forEach(fk=>{
        rec[fk] = resp.resultado.fechas[fk];
      });
      refreshAutoDateLabels();
    }
    showSaveBanner('Guardado', false);
  }catch(err){
    showSaveBanner('Sin conexión: no se guardó el cambio', true);
    input.value = oldVal;
  }
  input.disabled = false;
}

function refreshAutoDateLabels(){
  const uid = currentDetailUid;
  if(uid==null) return;
  const r = byUid[uid];
  ['fecha_val_pass','fecha_val_cap','fecha_obs2'].forEach(fk=>{
    const wrap = document.querySelector('[data-field-wrap="'+fk+'"]');
    if(wrap){
      const inp = wrap.querySelector('input');
      if(inp) inp.value = fmtDate(r[fk]) || 'sin registrar';
    }
  });
}

async function handleConfigToggle(input){
  const clave = input.closest('[data-clave]').dataset.clave;
  const columna = input.dataset.columna;
  const valor = input.checked;
  input.disabled = true;
  try{
    const resp = await apiPost({action:'config_update', clave, columna, valor});
    if(!resp.ok){
      input.checked = !valor;
      showSaveBanner('No se pudo guardar: ' + (resp.error||'error'), true);
    }else{
      showSaveBanner('Guardado', false);
    }
  }catch(err){
    input.checked = !valor;
    showSaveBanner('Sin conexión: no se guardó el cambio', true);
  }
  input.disabled = false;
}

document.getElementById('configBtn').addEventListener('click', showConfigScreen);

/* ============================================================
   EXPORTAR CSV (solo campos visibles para el rol actual)
   ============================================================ */
function buildCsv(){
  const keys = CAMPOS.map(c=>c.clave);
  const headers = CAMPOS.map(c=>c.etiqueta);
  const rows = [headers];
  workingData.forEach(r=>{
    rows.push(keys.map(k=>r[k]));
  });
  const csv = rows.map(row => row.map(cell=>{
    let s = (cell==null?'':String(cell)).replace(/"/g,'""');
    return '"'+s+'"';
  }).join(',')).join('\r\n');
  return '\uFEFF' + csv;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function handleExport(){
  const csv = buildCsv();
  const filename = 'clientes_' + ROL + '_' + todayISO() + '.csv';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportBtn').addEventListener('click', handleExport);

/* ============================================================
   BÚSQUEDA — listeners
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', debounce(()=>{
  resultLimit = 60;
  const cb = document.getElementById('clearSearch');
  cb.style.display = document.getElementById('searchInput').value ? 'block' : 'none';
  renderResults();
}, 150));
document.getElementById('clearSearch').addEventListener('click', ()=>{
  document.getElementById('searchInput').value='';
  document.getElementById('clearSearch').style.display='none';
  renderResults();
  document.getElementById('searchInput').focus();
});

/* ============================================================
   INICIO — reconexión automática si ya había una sesión guardada
   ============================================================ */
(function start(){
  const saved = loadSavedCreds();
  if(saved && saved.usuario && saved.contrasena){
    document.getElementById('inputUsuario').value = saved.usuario;
    setLoginBusy(true);
    attemptLogin(saved.usuario, saved.contrasena, true).then(ok=>{
      if(!ok) setLoginBusy(false);
    });
  }
})();
</script>
